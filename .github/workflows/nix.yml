name: CI
on:
  push:
    branches:
      - main
      - leaktest_ready
jobs:
  # Build the MixOS configuration for FillStation and push it to FlakeHub Cache
  build-publish:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v2
      - run: nix build .#mixosConfigurations.fill-station.config.boot.kernel
      - run: nix build .#mixosConfigurations.fill-station.config.system.build.initrd
      - run: nix build .#mixosConfigurations.fill-station.config.system.build.sdImage
      # Publish the SD image as a GitHub artifact so it can be downloaded
      # without FlakeHub auth: gh run download -n fill-station-sd-image
      - run: cp -L result/fill-station.img fill-station.img
      - uses: actions/upload-artifact@v4
        with:
          name: fill-station-sd-image
          path: fill-station.img
          retention-days: 14
